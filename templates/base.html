<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Router</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header><a href="{{ url_for('index') }}" class="brand">↗ Task Router</a><span>LOCAL OPERATIONS WORKSPACE</span></header><main>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer>Local demo · Operator actions are recorded · Refresh manually to see updates</footer></body></html>
